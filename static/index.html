<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plex Poster Editor | Studio</title>
  <!-- Space Grotesk for Industrial Cinema Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header" aria-label="Main Navigation">
    <div class="logo">
      <img src="logo.png" alt="Plex Studio Logo" width="32" height="32">
      <h1>PLEX // STUDIO</h1>
    </div>
    
    <div class="server-status" id="server-status" aria-live="polite">
      Checking connection...
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="Library Controls">
      <div class="select-wrapper">
        <label for="library-select">SOURCE LIBRARY</label>
        <select id="library-select" disabled aria-busy="true">
          <option>Loading libraries...</option>
        </select>
      </div>
    </section>

    <section class="movies-grid" id="movies-grid" aria-label="Movie Grid">
    </section>
  </main>

  <!-- Slide-in Inspector Panel (replacing the modal) -->
  <div class="inspector-backdrop" id="inspector-backdrop" aria-hidden="true"></div>
  <aside class="inspector-panel" id="inspector-panel" role="dialog" aria-modal="true" aria-labelledby="modal-movie-title" aria-hidden="true" tabindex="-1">
    
    <header class="inspector-header">
      <h2 id="modal-movie-title">TITLE</h2>
      <button class="close-btn" id="close-inspector" aria-label="Close Inspector">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="inspector-body">
      <div class="inspector-left">
        <!-- Input Section -->
        <div class="panel-section prompt-section">
          <label class="section-label">GENERATION PARAMETERS</label>
          <textarea id="prompt-input" rows="2" placeholder="e.g. Desaturate background, isolate subject, add highly contrasted grit..." aria-label="Visual manipulation prompt"></textarea>
        </div>

        <!-- Selection Section -->
        <div class="panel-section base-plates-section">
          <label class="section-label">BASE PLATES (OPTIONAL)</label>
          <div class="reference-gallery" id="reference-gallery" role="radiogroup" aria-label="Base Reference Posters">
            <!-- Alternative posters injected here -->
          </div>
        </div>
      </div>

      <div class="inspector-right">
        <!-- Result Output -->
        <div class="panel-section visual-diff">
          <label class="section-label">OUTPUT RENDER / COMPARISON</label>
          <div class="posters-comparison">
            <div class="poster-column">
              <span class="poster-badge">SOURCE</span>
              <div class="poster-frame source-frame">
                <img id="current-poster-img" src="" alt="Base Source Poster" />
              </div>
            </div>
            
            <div class="poster-column">
              <span class="poster-badge" aria-live="polite" id="render-status-badge">TARGET</span>
              <div class="poster-frame target-frame" id="new-poster-frame">
                <div class="placeholder active" id="new-poster-placeholder">
                  AWAITING INPUT
                </div>
                <img id="new-poster-img" src="" alt="Generated AI Poster" class="hidden" />
                <div class="loading-overlay hidden" id="loading-overlay" role="status" aria-live="assertive">
                  <div class="scanning-bar"></div>
                  <p>PROCESSING TENSOR</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <footer class="inspector-footer">
      <button class="btn btn-primary" id="generate-btn">EXECUTE RENDER</button>
      <button class="btn btn-success hidden" id="apply-btn">COMMIT TO SERVER</button>
    </footer>
  </aside>

  <script src="app.js"></script>
</body>
</html>
